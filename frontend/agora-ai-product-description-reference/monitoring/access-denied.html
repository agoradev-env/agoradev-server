<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Denied</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: #f5f6f8;
            font-family: Arial, sans-serif;
            color: #202124;
        }

        .access-card {
            width: 100%;
            max-width: 440px;
            padding: 40px 30px;
            text-align: center;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
        }

        .icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: #feecec;
            color: #c62828;
            font-size: 32px;
        }

        h1 {
            margin: 0 0 14px;
            font-size: 24px;
            color: #c62828;
        }

        p {
            margin: 0;
            font-size: 15px;
            line-height: 1.7;
            color: #555;
        }

        a {
            display: inline-block;
            margin-top: 24px;
            color: #333;
            text-decoration: none;
            font-weight: 600;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <main class="access-card">
        <div class="icon">!</div>

        <h1>ACCESS DENIED</h1>

        <p>
            You don't have permission to access this page.
            Please contact an administrator if you believe
            this is an error.
        </p>

        <a href="/monitoring/login">Return to sign in</a>
    </main>
</body>
</html>
