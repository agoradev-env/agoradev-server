
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Request Activity | Agora</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="dashboard">
        <header class="dashboard-header">
            <div>
                <h1>Request Activity</h1>
                <p>Agora Marketplace · AI Operations</p>
            </div>
            <a href="index.html">← Dashboard Overview</a>
        </header>

        <section class="activity-summary">
            <article class="activity-stat">
                <span>Total Requests</span>
                <strong id="activity-total">0</strong>
            </article>

            <article class="activity-stat">
                <span>Successful</span>
                <strong id="activity-success">0</strong>
            </article>

            <article class="activity-stat">
                <span>Failed</span>
                <strong id="activity-failed">0</strong>
            </article>

            <article class="activity-stat">
                <span>Total Tokens</span>
                <strong id="activity-tokens">0</strong>
            </article>

            <article class="activity-stat">
                <span>Total Cost</span>
                <strong id="activity-cost">$0.0000</strong>
            </article>
        </section>

        <section class="card">
            <h2>Request History</h2>

            <div class="activity-filters">
                <button class="filter-button active" data-filter="all">All</button>
                <button class="filter-button" data-filter="success">Successful</button>
                <button class="filter-button" data-filter="failed">Failed</button>
            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Request ID</th>
                            <th>Provider</th>
                            <th>Model</th>
                            <th>Tokens</th>
                            <th>Cost</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="activity-table">
                        <tr>
                            <td colspan="7">Loading request records...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="activity.js"></script>
</body>
</html>
